name: Build NeoForge

on:
  push:
    branches: [ FeudalKings ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-user-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-user-

      - name: Cache project .gradle
        uses: actions/cache@v4
        with:
          path: ./.gradle
          key: ${{ runner.os }}-gradle-proj-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-proj-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get release tag from versions
        id: tag
        run: |
          MC=$(awk -F"'" '/^minecraft = /{print $2}' gradle/libs.versions.toml)
          NF=$(awk -F"'" '/^neoforge = /{print $2}' gradle/libs.versions.toml)
          echo "name=neoforge${MC}-${NF}" >> $GITHUB_OUTPUT
          echo "Release tag: neoforge${MC}-${NF}"

      - name: Build NeoForge JAR
        run: ./gradlew :bootstrap:neoforgeJar --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.tag.outputs.name }}
          gh release delete "$TAG" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "NeoForge ${{ steps.tag.outputs.name }} built from commit ${{ github.sha }}" \
            bootstrap/build/libs/arclight-neoforge-*.jar
